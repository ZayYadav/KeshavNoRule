plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid'
}

apply plugin: 'top.niunaijun.blackobfuscator'

class Scrambler {
    Random random = new Random()
    String getRandomString(int i) {
        return random.with {(1..(6 + random.nextInt(i))).collect {(('a'..'z')).join()[ nextInt((('a'..'z')).join().length())]}.join()}
    }
}

Scrambler scrambler = new Scrambler()

def teamDarkKeystore = file('TeamDarkParallax.jks')
def teamDarkStorePassword = 'TeamDarkParallax@2026#Release'
def teamDarkKeyPassword = 'TeamDarkParallax@2026#Release'
def teamDarkKeyAlias = 'TeamDarkParallax'

android {
    namespace 'com.dark.panther'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("zen.jks")
            storePassword "11111111"
            keyPassword "11111111"
            keyAlias "key0"
        }
        release {
            storeFile teamDarkKeystore
            storePassword teamDarkStorePassword ?: "MISSING_TEAM_DARK_STORE_PASSWORD"
            keyPassword teamDarkKeyPassword ?: "MISSING_TEAM_DARK_KEY_PASSWORD"
            keyAlias teamDarkKeyAlias
        }
    }

    lint { baseline = file("lint-baseline.xml") }

    defaultConfig {
        // Keep host id unchanged for current SDK/signing/panel compatibility.
        applicationId "com.team.dark"
        minSdk 24
        //noinspection OldTargetApi,EditedTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 1
        versionName "PANTHERv1"
        vectorDrawables { useSupportLibrary true }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild { cmake { cppFlags '' } }
        ndk { abiFilters "arm64-v8a" }
        resourceConfigurations += ['en']
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'NONE' }
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    lsparanoid {
        seed = 1919810
        global = false
        includeDependencies = false
        variantFilter = { true }
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }
    ndkVersion "24.0.8215888"
}

dependencies {
    implementation fileTree(dir: "libs", includes: ["*.aar"])
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.google.android.material:material:1.11.0'
}

BlackObfuscator {
    enabled true
    depth 2
    obfClass = ["com.dark.panther"]
    blackClass = [
            "com.dark.panther.R",
            "com.dark.panther.BuildConfig",
            "com.dark.panther.core.PantherLoaderUpdater",
            "com.dark.panther.core.PantherNative"
    ]
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        def n = task.name.toLowerCase(Locale.ROOT)
        n.contains('release') && (n.contains('assemble') || n.contains('bundle') || n.contains('package'))
    }
    if (releaseRequested) {
        if (!teamDarkKeystore.isFile()) {
            throw new GradleException('Missing release keystore required for current compatibility identity.')
        }
        if (teamDarkKeyAlias != 'TeamDarkParallax') {
            throw new GradleException('Release signing alias mismatch.')
        }
    }
}
