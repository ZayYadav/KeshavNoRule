plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid'
}

apply plugin: 'top.niunaijun.blackobfuscator'

class Scrambler {
    Random random = new Random()

    String getRandomString(int i) {
        return random.with {(1..(6 + random.nextInt(i))).collect {(('a'..'z')).join()[ nextInt((('a'..'z')).join().length())]}.join()}
    }
}

Scrambler scrambler = new Scrambler()

def teamDarkKeystore = file('TeamDarkParallax.jks')
def teamDarkStorePassword = 'TeamDarkParallax@2026#Release'
def teamDarkKeyPassword = 'TeamDarkParallax@2026#Release'
def teamDarkKeyAlias = 'TeamDarkParallax'

android {
    namespace 'com.bgmi'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile teamDarkKeystore
            storePassword teamDarkStorePassword
            keyPassword teamDarkKeyPassword
            keyAlias teamDarkKeyAlias
        }
        release {
            storeFile teamDarkKeystore
            storePassword teamDarkStorePassword
            keyPassword teamDarkKeyPassword
            keyAlias teamDarkKeyAlias
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId "com.bgmi"
        minSdk 24
        //noinspection OldTargetApi,EditedTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 1
        versionName "2024.09.21"

        vectorDrawables {
            useSupportLibrary true
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }

        resourceConfigurations += ['en']
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'NONE'
            }
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    lsparanoid {
        seed = 1919810
        global = false
        includeDependencies = false
        variantFilter = { true }
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }
    ndkVersion "24.0.8215888"
}

dependencies {
    implementation fileTree(dir: "libs", includes: ["*.aar"])
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.google.android.material:material:1.11.0'
}

BlackObfuscator {
    enabled true
    depth 2
    obfClass = ["com.bgmi"]
    blackClass = ["com.bgmi.R", "com.bgmi.BuildConfig", "com.bgmi.utils.BabaDark5"]
}

gradle.taskGraph.whenReady { graph ->
    def signedBuildRequested = graph.allTasks.any { task ->
        def n = task.name.toLowerCase(Locale.ROOT)
        (n.contains('assemble') || n.contains('bundle') || n.contains('package'))
    }
    if (signedBuildRequested) {
        if (!teamDarkKeystore.isFile()) {
            throw new GradleException('Missing app/TeamDarkParallax.jks. BABATILLU must use the exact TeamDark signing keystore.')
        }
        if (teamDarkKeyAlias != 'TeamDarkParallax') {
            throw new GradleException('BABATILLU signing alias must be TeamDarkParallax.')
        }
    }
}
