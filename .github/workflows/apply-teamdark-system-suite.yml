name: Apply TeamDark System Suite

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/apply-teamdark-system-suite.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
      - name: Repair finalizer quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/finalize_teamdark_system_suite.py')
          s = p.read_text()
          bad = "s = s.replace('aria-label=\"Team Dark cinematic opening\"', 'aria-label=\"'.$brandName.' cinematic opening\"')"
          good = "s = s.replace('aria-label=\"Team Dark cinematic opening\"', \"aria-label=\\\"'.$brandName.' cinematic opening\\\"\")"
          if bad not in s:
              raise SystemExit('finalizer quote marker not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          python3 -m py_compile scripts/finalize_teamdark_system_suite.py
      - name: Apply final polish
        run: python3 scripts/finalize_teamdark_system_suite.py
      - name: Validate final suite
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/View.php
          php -l teamdark-panel/app/OwnerSystem.php
          php -l teamdark-panel/public/index.php
          node --check teamdark-panel/public/assets/owner-tools.js
          grep -F "'Extend Duration'" teamdark-panel/app/View.php >/dev/null
          grep -F "'/keys/extend'" teamdark-panel/public/index.php >/dev/null
          grep -F "Extend / Edit" teamdark-panel/public/index.php >/dev/null
          grep -F '$brandMark' teamdark-panel/app/View.php >/dev/null
      - name: Commit final application polish
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel/app/View.php teamdark-panel/app/OwnerSystem.php teamdark-panel/public/index.php
          git commit -m 'Finish screenshot-inspired owner panel modules'
          git push origin HEAD:TeamDarkLoader
