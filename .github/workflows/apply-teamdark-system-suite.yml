name: Apply TeamDark System Suite

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/apply-teamdark-system-suite.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
      - name: Apply patch script
        run: python3 scripts/apply_teamdark_system_suite.py
      - name: Validate PHP and JavaScript
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/PanelControl.php
          php -l teamdark-panel/app/Security.php
          php -l teamdark-panel/app/KeyManager.php
          php -l teamdark-panel/app/OwnerSystem.php
          php -l teamdark-panel/app/View.php
          php -l teamdark-panel/public/index.php
          php -l teamdark-panel/public/vault.php
          php -l teamdark-panel/public/vault-entry.php
          node --check teamdark-panel/public/assets/owner-tools.js
          grep -F "'File Manager'" teamdark-panel/app/View.php >/dev/null
          grep -F "'/owner/ip-management'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "generated_key_prefix" teamdark-panel/app/KeyManager.php >/dev/null
          grep -F "key_cost_per_day" teamdark-panel/app/KeyManager.php >/dev/null
          grep -F "ownerIpPolicyBlocked" teamdark-panel/public/index.php >/dev/null
          grep -F "CdnCache" teamdark-panel/public/vault.php >/dev/null
      - name: Commit application changes
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel/app/PanelControl.php teamdark-panel/app/Security.php teamdark-panel/app/KeyManager.php teamdark-panel/app/OwnerSystem.php teamdark-panel/app/View.php teamdark-panel/public/index.php teamdark-panel/public/vault.php teamdark-panel/public/vault-entry.php teamdark-panel/public/assets/owner-tools.js
          git commit -m 'Add modular File Manager and owner system suite'
          git push origin HEAD:TeamDarkLoader
