        $token = '';

        for ($i = 0; $i < 16; $i++) {
            $token .= $alphabet[random_int(0, strlen($alphabet) - 1)];
        }

        return 'Team-Dark-'.$token;
    }
"""
          new="""    private static function newLicense(): string
