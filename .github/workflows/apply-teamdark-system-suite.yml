            $prefix = 'Team-Dark-';
        }
        $length = max(8, min(32, (int)($settings['generated_key_length'] ?? 16)));
        $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        $token = '';

