name: Build BABA DARK LOADER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - BABATILLU
      - connect-api-compatible-20260904
      - keshavowner-security-ui-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout BABATILLU
        uses: actions/checkout@v4

      - name: Checkout exact TeamDark signing source
        uses: actions/checkout@v4
        with:
          repository: ZayYadav/KeshavNoRule
          ref: TeamDarkLoader
          path: _teamdark_signing_source
          fetch-depth: 1

      - name: Install exact TeamDark signing key
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='_teamdark_signing_source/app/TeamDarkParallax.jks'
          TARGET='app/TeamDarkParallax.jks'
          test -s "$SOURCE"
          cp -f "$SOURCE" "$TARGET"
          test -s "$TARGET"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify TeamDark keystore identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore app/TeamDarkParallax.jks \
            -storepass 'TeamDarkParallax@2026#Release' \
            -alias TeamDarkParallax \
            | tee /tmp/teamdark-key.txt
          NORMALIZED="$(tr -d ':[:space:]' < /tmp/teamdark-key.txt | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED" | grep -q '95d42274430c198e20056da00e5e4dcafd5935d93d2e4380e2788b1b7ff8a32f'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify TeamDark-style signature and dialog contract
        shell: bash
        run: |
          set -euo pipefail

          JAVA_GUARD='app/src/main/java/com/bgmi/BabaDark8.java'
          DIALOG_GUARD='app/src/main/java/com/bgmi/BabaDark9.java'
          LOGIN='app/src/main/java/com/bgmi/BabaDark2.java'
          HOME='app/src/main/java/com/bgmi/BabaDark3.java'
          SIGN_OVERRIDE='app/src/main/jni/teamdark_sign_override.cpp'
          CMAKE='app/src/main/jni/CMakeLists.txt'
          DIALOG='app/src/main/res/layout/integrity_failure_dialog.xml'
          GRADLE='app/build.gradle'

          grep -F "file('TeamDarkParallax.jks')" "$GRADLE" >/dev/null
          grep -F "teamDarkKeyAlias = 'TeamDarkParallax'" "$GRADLE" >/dev/null
          if grep -F 'storeFile file("zen.jks")' "$GRADLE"; then
            echo 'zen.jks must not sign BABATILLU builds.' >&2
            exit 1
          fi

          grep -F 'verifyInstalledSigningCertificate' "$JAVA_GUARD" >/dev/null
          grep -F 'verifyBaseApkSigningCertificate' "$JAVA_GUARD" >/dev/null
          grep -F '95d42274430c198e' "$JAVA_GUARD" >/dev/null
          grep -F '20056da00e5e4dca' "$JAVA_GUARD" >/dev/null
          grep -F 'fd5935d93d2e4380' "$JAVA_GUARD" >/dev/null
          grep -F 'e2788b1b7ff8a32f' "$JAVA_GUARD" >/dev/null

          grep -F '95d42274430c198e20056da00e5e4dcafd5935d93d2e4380e2788b1b7ff8a32f' "$SIGN_OVERRIDE" >/dev/null
          grep -F 'RegisterNatives' "$SIGN_OVERRIDE" >/dev/null
          grep -F 'nativeVerifySignature' "$SIGN_OVERRIDE" >/dev/null
          grep -F 'teamdark_sign_override.cpp' "$CMAKE" >/dev/null

          grep -F 'BabaDark8.verify(this)' "$LOGIN" >/dev/null
          grep -F 'nativeVerifySignature(this) && nativeCustomIntegrity(this)' "$LOGIN" >/dev/null
          grep -F 'BabaDark9.showIntegrityFailure' "$LOGIN" >/dev/null
          grep -F 'BabaDark8.verify(this)' "$HOME" >/dev/null
          grep -F 'BabaDark2.nativeVerifySignature(this)' "$HOME" >/dev/null
          grep -F 'BabaDark9.showIntegrityFailure' "$HOME" >/dev/null

          grep -F 'RUNTIME_GUARD_INTERVAL_MS = 3_000L' "$DIALOG_GUARD" >/dev/null
          grep -F 'BabaDark8.verify(activity)' "$DIALOG_GUARD" >/dev/null
          grep -F 'BabaDark2.nativeVerifySignature(activity)' "$DIALOG_GUARD" >/dev/null
          grep -F 'BabaDark2.nativeCustomIntegrity(activity)' "$DIALOG_GUARD" >/dev/null
          grep -F 'R.layout.integrity_failure_dialog' "$DIALOG_GUARD" >/dev/null
          grep -F 'integrityClose' "$DIALOG_GUARD" >/dev/null

          grep -F 'android:id="@+id/integrityDetail"' "$DIALOG" >/dev/null
          grep -F 'android:id="@+id/integrityClose"' "$DIALOG" >/dev/null
          grep -F 'APK INTEGRITY FAILED' "$DIALOG" >/dev/null

      - name: Build release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK and native allowlist
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"

          echo "APK: $APK"
          CERT_OUT="$("${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT_OUT"
          NORMALIZED_CERTS="$(printf '%s' "$CERT_OUT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED_CERTS" | grep -q '95d42274430c198e20056da00e5e4dcafd5935d93d2e4380e2788b1b7ff8a32f'

          mapfile -t LIBS < <(
            unzip -Z1 "$APK" \
              | grep '^lib/arm64-v8a/.*\.so$' \
              | sed 's#^lib/arm64-v8a/##' \
              | sort
          )

          printf 'Found libs:\n'
          printf '  %s\n' "${LIBS[@]}"

          EXPECTED="$(printf '%s\n' 'libKESHAVXOWNERCore.so' 'libBabaDarkLoader.so' | sort)"
          ACTUAL="$(printf '%s\n' "${LIBS[@]}" | sort)"
          test "$ACTUAL" = "$EXPECTED"

          if unzip -Z1 "$APK" | grep -q 'libakshit\.so'; then
            echo "Legacy libakshit.so unexpectedly present"
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -q 'libKeshavOwner\.so'; then
            echo "Legacy libKeshavOwner.so unexpectedly present"
            exit 1
          fi

          cp "$APK" app/build/outputs/apk/release/BABA-DARK-LOADER.apk

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            du -h app/build/outputs/apk/release/*.apk
            sha256sum app/build/outputs/apk/release/*.apk
          fi

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BABA-DARK-LOADER-release
          path: app/build/outputs/apk/release/BABA-DARK-LOADER.apk
          if-no-files-found: error
          retention-days: 14

# BABATILLU build trigger
