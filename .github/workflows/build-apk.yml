name: Build Parallax Virtual APK

on:
  workflow_dispatch:
  push:
    branches:
      - PARALLAXVIRTUAL
  pull_request:
    branches:
      - PARALLAXVIRTUAL

permissions:
  contents: read

jobs:
  build:
    name: Parallax Virtual Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK and native allowlist
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"

          echo "APK: $APK"
          CERT_OUT="$("${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT_OUT"
          NORMALIZED_CERTS="$(printf '%s' "$CERT_OUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED_CERTS" | grep -q "77f05d53ce8bf1855caef38ce87f13a8bb2b1b2cdd2d48da9d3ba897eac4549e"

          mapfile -t LIBS < <(
            unzip -Z1 "$APK" \
              | grep '^lib/arm64-v8a/.*\.so$' \
              | sed 's#^lib/arm64-v8a/##' \
              | sort
          )

          EXPECTED="$(printf '%s\n' 'libKESHAVXOWNERCore.so' 'libKeshavLoader.so' | sort)"
          ACTUAL="$(printf '%s\n' "${LIBS[@]}" | sort)"
          test "$ACTUAL" = "$EXPECTED"

          cp "$APK" app/build/outputs/apk/release/Parallax-Virtual.apk

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            du -h app/build/outputs/apk/release/*.apk
            sha256sum app/build/outputs/apk/release/*.apk
          fi

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Parallax-Virtual-release
          path: app/build/outputs/apk/release/Parallax-Virtual.apk
          if-no-files-found: error
          retention-days: 14
