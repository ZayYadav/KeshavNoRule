name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - connect-api-compatible-20260904
      - keshavowner-security-ui-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore private signing key
        shell: bash
        env:
          KESHAV_SIGNING_KEY_BASE64: ${{ secrets.KESHAV_SIGNING_KEY_BASE64 }}
          KESHAV_SIGNING_STORE_PASSWORD: ${{ secrets.KESHAV_SIGNING_STORE_PASSWORD }}
          KESHAV_SIGNING_KEY_ALIAS: ${{ secrets.KESHAV_SIGNING_KEY_ALIAS }}
          KESHAV_SIGNING_KEY_PASSWORD: ${{ secrets.KESHAV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KESHAV_SIGNING_KEY_BASE64"
          test -n "$KESHAV_SIGNING_STORE_PASSWORD"
          test -n "$KESHAV_SIGNING_KEY_ALIAS"
          test -n "$KESHAV_SIGNING_KEY_PASSWORD"

          mkdir -p "$RUNNER_TEMP/keshav-signing"
          printf '%s' "$KESHAV_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keshav-signing/KeshavLoader-release.jks"
          chmod 600 "$RUNNER_TEMP/keshav-signing/KeshavLoader-release.jks"

          keytool -list             -keystore "$RUNNER_TEMP/keshav-signing/KeshavLoader-release.jks"             -storepass "$KESHAV_SIGNING_STORE_PASSWORD"             -alias "$KESHAV_SIGNING_KEY_ALIAS" >/dev/null

      - name: Build release APK
        env:
          KESHAV_SIGNING_STORE_FILE: ${{ runner.temp }}/keshav-signing/KeshavLoader-release.jks
          KESHAV_SIGNING_STORE_PASSWORD: ${{ secrets.KESHAV_SIGNING_STORE_PASSWORD }}
          KESHAV_SIGNING_KEY_ALIAS: ${{ secrets.KESHAV_SIGNING_KEY_ALIAS }}
          KESHAV_SIGNING_KEY_PASSWORD: ${{ secrets.KESHAV_SIGNING_KEY_PASSWORD }}
        run: ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK and native allowlist
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"

          echo "APK: $APK"
          echo "Verifying signing certificate..."
          CERT_OUT="$("${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT_OUT"
          NORMALIZED_CERTS="$(printf '%s' "$CERT_OUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED_CERTS" | grep -q "93a4175b8945b658a95ff2863a3ca1ce03c840044e27567cb46f5e0a569e3d64"

          echo "Verifying packaged native libraries..."
          mapfile -t LIBS < <(
            unzip -Z1 "$APK" \
              | grep '^lib/arm64-v8a/.*\.so$' \
              | sed 's#^lib/arm64-v8a/##' \
              | sort
          )

          printf 'Found libs:\n'
          printf '  %s\n' "${LIBS[@]}"

          EXPECTED="$(printf '%s\n' 'libKESHAVXOWNERCore.so' 'libKeshavLoader.so' | sort)"
          ACTUAL="$(printf '%s\n' "${LIBS[@]}" | sort)"
          test "$ACTUAL" = "$EXPECTED"

          if unzip -Z1 "$APK" | grep -q 'libakshit\.so'; then
            echo "Legacy libakshit.so unexpectedly present"
            exit 1
          fi

          if unzip -Z1 "$APK" | grep -q 'libKeshavOwner\.so'; then
            echo "Legacy libKeshavOwner.so unexpectedly present"
            exit 1
          fi

          cp "$APK" app/build/outputs/apk/release/NO-RULE-LOADER.apk

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            du -h app/build/outputs/apk/release/*.apk
            sha256sum app/build/outputs/apk/release/*.apk
          fi

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NO-RULE-LOADER-release
          path: app/build/outputs/apk/release/NO-RULE-LOADER.apk
          if-no-files-found: error
          retention-days: 14
