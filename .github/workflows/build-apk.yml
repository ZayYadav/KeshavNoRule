name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - connect-api-compatible-20260904
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeshavNoRule-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
