name: Apply Owner-Only Unlimited Policy

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/apply-owner-only-unlimited.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader

      - name: Restrict unlimited license controls to Owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Central generation service: non-owner cannot request either Unlimited entitlement.
          replace_once(
              'teamdark-panel/app/KeyManager.php',
              """        PanelControl::assertGeneration($actor);\n        if (!$unlimitedExpiry && $durationSeconds < 86400) {""",
              """        PanelControl::assertGeneration($actor);\n\n        if (($actor['role'] ?? '') !== 'owner' && ($unlimitedExpiry || $unlimitedDevices)) {\n            throw new RuntimeException('Unlimited validity and unlimited devices are reserved for Owner.');\n        }\n\n        if (!$unlimitedExpiry && $durationSeconds < 86400) {"""
          )

          # Key editor: a non-owner cannot escalate or alter Owner-managed Unlimited flags.
          replace_once(
              'teamdark-panel/app/KeyEditor.php',
              """            $row = self::rowForActor($pdo, $actor, $keyId, true);\n            if (!$row) throw new RuntimeException('Key not found or not allowed.');\n\n            $deviceQ = $pdo->prepare(""",
              """            $row = self::rowForActor($pdo, $actor, $keyId, true);\n            if (!$row) throw new RuntimeException('Key not found or not allowed.');\n\n            $isOwner = (($actor['role'] ?? '') === 'owner');\n            if (!$isOwner) {\n                $oldUnlimitedExpiry = (bool)$row['unlimited_expiry'];\n                $oldUnlimitedDevices = (bool)$row['unlimited_devices'];\n\n                if (($unlimitedExpiry && !$oldUnlimitedExpiry) || ($unlimitedDevices && !$oldUnlimitedDevices)) {\n                    throw new RuntimeException('Unlimited validity and unlimited devices are reserved for Owner.');\n                }\n\n                // Existing Owner-granted Unlimited entitlements are read-only for non-owner accounts.\n                $unlimitedExpiry = $oldUnlimitedExpiry;\n                $unlimitedDevices = $oldUnlimitedDevices;\n            }\n\n            $deviceQ = $pdo->prepare("""
          )

          # Generate-key UI: do not render Unlimited controls to non-owner accounts.
          replace_once(
              'teamdark-panel/public/index.php',
              """        $deviceOptions .= '<option value=\"unlimited\">Unlimited devices</option>';""",
              """        if (($user['role'] ?? '') === 'owner') {\n            $deviceOptions .= '<option value=\"unlimited\">Unlimited devices</option>';\n        }"""
          )
          replace_once(
              'teamdark-panel/public/index.php',
              """        $pricing = ownerUnlimited($user)\n            ? 'Owner generation cost: 0 credits.'\n            : 'Timed cost: '.(int)Config::get('key_cost')\n                .' credit(s) per day. Unlimited validity: '\n                .(int)Config::get('unlimited_key_cost').' credits.';""",
              """        $pricing = ownerUnlimited($user)\n            ? 'Owner generation cost: 0 credits. Unlimited validity and devices available.'\n            : 'Timed cost: '.(int)Config::get('key_cost')\n                .' credit(s) per day. Unlimited options are Owner-only.';"""
          )
          replace_once(
              'teamdark-panel/public/index.php',
              """                .'<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_expiry\" value=\"1\" data-unlimited-toggle> Unlimited validity</label>'\n                .'<button type=\"submit\" class=\"primary wide\" data-submit-label=\"Generating…\">Generate key</button>'""",
              """                .(($user['role'] ?? '') === 'owner'\n                    ? '<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_expiry\" value=\"1\" data-unlimited-toggle> Unlimited validity</label>'\n                    : '')\n                .'<button type=\"submit\" class=\"primary wide\" data-submit-label=\"Generating…\">Generate key</button>'"""
          )
          replace_once(
              'teamdark-panel/public/index.php',
              """            $unlimitedExpiry = isset($_POST['unlimited_expiry'])\n                && $_POST['unlimited_expiry'] === '1';\n\n            $deviceRaw = input('max_devices', '10');\n            $unlimitedDevices = $deviceRaw === 'unlimited';\n            $maxDevices = $unlimitedDevices ? 1 : (int)$deviceRaw;""",
              """            $requestedUnlimitedExpiry = isset($_POST['unlimited_expiry'])\n                && $_POST['unlimited_expiry'] === '1';\n\n            $deviceRaw = input('max_devices', '10');\n            $requestedUnlimitedDevices = $deviceRaw === 'unlimited';\n\n            if (($user['role'] ?? '') !== 'owner' && ($requestedUnlimitedExpiry || $requestedUnlimitedDevices)) {\n                throw new RuntimeException('Unlimited validity and unlimited devices are reserved for Owner.');\n            }\n\n            $unlimitedExpiry = (($user['role'] ?? '') === 'owner') && $requestedUnlimitedExpiry;\n            $unlimitedDevices = (($user['role'] ?? '') === 'owner') && $requestedUnlimitedDevices;\n            $maxDevices = $unlimitedDevices ? 1 : (int)$deviceRaw;"""
          )

          # Edit-key UI: render Unlimited switches only for Owner.
          replace_once(
              'teamdark-panel/public/key-edit.php',
              """    $owner = trim((string)($row['owner_display_name'] ?? '')) ?: (string)$row['owner_name'];\n\n    $body = '<link rel=\"stylesheet\" href=\"/assets/vault.css?v=20260910-2\">'""",
              """    $owner = trim((string)($row['owner_display_name'] ?? '')) ?: (string)$row['owner_name'];\n    $isOwner = (($user['role'] ?? '') === 'owner');\n    $unlimitedControls = $isOwner\n        ? '<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_expiry\" value=\"1\" '.((int)$row['unlimited_expiry'] === 1 ? 'checked' : '').'> Unlimited validity</label>'\n            .'<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_devices\" value=\"1\" '.((int)$row['unlimited_devices'] === 1 ? 'checked' : '').'> Unlimited devices</label>'\n        : '<p class=\"hint\">Unlimited validity and unlimited devices are Owner-only. Existing Owner-granted unlimited entitlements are read-only here.</p>';\n\n    $body = '<link rel=\"stylesheet\" href=\"/assets/vault.css?v=20260910-2\">'"""
          )
          replace_once(
              'teamdark-panel/public/key-edit.php',
              """        .'<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_expiry\" value=\"1\" '.((int)$row['unlimited_expiry'] === 1 ? 'checked' : '').'> Unlimited validity</label>'\n        .'<label class=\"checkline\"><input type=\"checkbox\" name=\"unlimited_devices\" value=\"1\" '.((int)$row['unlimited_devices'] === 1 ? 'checked' : '').'> Unlimited devices</label>'\n        .'<p class=\"hint\">For non-owner accounts, increasing validity deducts only the extra credit difference. Downgrades do not refund credits. Owner edits cost 0.</p>'""",
              """        .$unlimitedControls\n        .'<p class=\"hint\">For non-owner accounts, increasing finite validity deducts only the extra credit difference. Downgrades do not refund credits. Owner edits cost 0.</p>'"""
          )

          # Self-disable after this successful one-shot patch.
          workflow = Path('.github/workflows/apply-owner-only-unlimited.yml')
          wt = workflow.read_text(encoding='utf-8')
          old_trigger = """on:\n  push:\n    branches:\n      - TeamDarkLoader\n    paths:\n      - '.github/workflows/apply-owner-only-unlimited.yml'\n  workflow_dispatch:\n"""
          new_trigger = """on:\n  workflow_dispatch:\n"""
          if old_trigger not in wt:
              raise SystemExit('one-shot workflow trigger block not found')
          workflow.write_text(wt.replace(old_trigger, new_trigger, 1), encoding='utf-8')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/KeyManager.php
          php -l teamdark-panel/app/KeyEditor.php
          php -l teamdark-panel/public/index.php
          php -l teamdark-panel/public/key-edit.php
          grep -F 'Unlimited validity and unlimited devices are reserved for Owner.' teamdark-panel/app/KeyManager.php >/dev/null
          grep -F 'Unlimited validity and unlimited devices are reserved for Owner.' teamdark-panel/app/KeyEditor.php >/dev/null
          grep -F 'Unlimited options are Owner-only.' teamdark-panel/public/index.php >/dev/null

      - name: Commit owner-only policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel/app/KeyManager.php \
                  teamdark-panel/app/KeyEditor.php \
                  teamdark-panel/public/index.php \
                  teamdark-panel/public/key-edit.php \
                  .github/workflows/apply-owner-only-unlimited.yml
          git diff --cached --check
          git commit -m 'Restrict unlimited license options to owner'
          git push origin HEAD:TeamDarkLoader
