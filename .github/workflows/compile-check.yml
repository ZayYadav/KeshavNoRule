name: Compile Check

on:
  workflow_dispatch:
  push:
    branches:
      - keshavowner-security-ui-v1

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile unsigned release
        run: ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify compiled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libKeshavLoader.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libKESHAVXOWNERCore.so$'
          echo "Unsigned compile check passed: $APK"
