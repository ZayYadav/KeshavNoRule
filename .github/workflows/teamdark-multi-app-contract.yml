name: TeamDark Multi App API Contract

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-multi-app-contract.yml'
  pull_request:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-multi-app-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-app-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: teamdark_multi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, json, curl, fileinfo
          coverage: none

      - name: Install test utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-client jq curl

      - name: Configure isolated panel
        shell: bash
        run: |
          set -euo pipefail
          APP_KEY="$(php -r 'echo base64_encode(random_bytes(32));')"
          echo "::add-mask::$APP_KEY"
          cat > teamdark-panel/.env <<EOF
          APP_NAME="TeamDark Multi App Test"
          APP_URL="http://127.0.0.1:8080"
          APP_KEY="$APP_KEY"
          DB_HOST="127.0.0.1"
          DB_PORT="3306"
          DB_NAME="teamdark_multi_test"
          DB_USER="root"
          DB_PASS="root"
          SESSION_NAME="TDMULTITESTSESSID"
          REGISTRATION_BONUSES_ENABLED="false"
          REFERRER_BONUS="0"
          SIGNUP_BONUS="0"
          KEY_COST="1"
          UNLIMITED_KEY_COST="100"
          TEAMDARK_AUTH_SECRET="MULTI_APP_TEST_SECRET_32_CHARS_OK"
          TELEGRAM_BOT_TOKEN=""
          TELEGRAM_WEBHOOK_SECRET=""
          TELEGRAM_OWNER_CHAT_ID=""
          LEGACY_LICENSE_API_ENABLED="false"
          API_REVEAL_LICENSE_KEYS="false"
          TELEGRAM_OWNER_MUTATIONS_ENABLED="false"
          TELEGRAM_OWNER_SENSITIVE_READS_ENABLED="false"
          TELEGRAM_LINKED_KEY_GENERATION_ENABLED="false"
          TELEGRAM_GUEST_FREE_KEYS_ENABLED="false"
          ADMIN_BALANCE_ADJUSTMENTS_ENABLED="false"
          ADMIN_BALANCE_DAILY_LIMIT="10000"
          ADMIN_REFERRAL_BONUS_ENABLED="false"
          AUDIT_RETENTION_DAYS="90"
          BROADCAST_RETENTION_DAYS="30"
          TRUSTED_PROXY_CIDRS=""
          EOF

      - name: Verify schema migration and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/AppRegistry.php
          php -l teamdark-panel/app/ReferralManager.php
          php -l teamdark-panel/app/KeyManager.php
          php -l teamdark-panel/app/LoaderAuthService.php
          php -l teamdark-panel/public/connect.php
          php -l teamdark-panel/public/app-api-manager.php
          php -l teamdark-panel/public/register-relaxed.php
          php -l teamdark-panel/public/index.php
          mysql -h127.0.0.1 -uroot -proot teamdark_multi_test < teamdark-panel/database/schema.sql
          mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SHOW TABLES LIKE 'app_registry';" | grep -F app_registry >/dev/null
          mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SHOW TABLES LIKE 'user_app_access';" | grep -F user_app_access >/dev/null
          mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SHOW TABLES LIKE 'referral_app_access';" | grep -F referral_app_access >/dev/null
          mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SHOW COLUMNS FROM license_keys LIKE 'app_id';" | grep -F app_id >/dev/null

      - name: Seed existing official contract fixtures
        shell: bash
        run: php teamdark-panel/tests/seed_native_auth.php >/tmp/native-seed.json

      - name: Run multi-app service isolation contract
        shell: bash
        run: php teamdark-panel/tests/multi_app_contract.php

      - name: Verify schema rerun preserves scoped access
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT COUNT(*) FROM user_app_access WHERE app_id=1")" -eq 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT COUNT(*) FROM referral_app_access WHERE app_id=1")" -eq 0
          mysql -h127.0.0.1 -uroot -proot teamdark_multi_test < teamdark-panel/database/schema.sql
          test "$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT COUNT(*) FROM user_app_access WHERE app_id=1")" -eq 0
          test "$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT COUNT(*) FROM referral_app_access WHERE app_id=1")" -eq 0

      - name: Start HTTP contract server
        shell: bash
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t teamdark-panel/public teamdark-panel/tests/router.php >/tmp/teamdark-multi-http.log 2>&1 &
          echo $! >/tmp/teamdark-multi-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/connect >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/teamdark-multi-http.log >&2 || true
          exit 1

      - name: Verify real HTTP endpoint isolation and official compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_A_TOKEN="$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT endpoint_token FROM app_registry WHERE name='Contract App Alpha' LIMIT 1")"
          APP_B_TOKEN="$(mysql -N -h127.0.0.1 -uroot -proot teamdark_multi_test -e "SELECT endpoint_token FROM app_registry WHERE name='Contract App Beta' LIMIT 1")"
          test -n "$APP_A_TOKEN"
          test -n "$APP_B_TOKEN"

          curl -fsS "http://127.0.0.1:8080/connect/$APP_A_TOKEN" | grep -F 'Contract App Alpha' >/dev/null
          curl -fsS "http://127.0.0.1:8080/connect/$APP_B_TOKEN" | grep -F 'Contract App Beta' >/dev/null

          curl -sS -X POST "http://127.0.0.1:8080/connect/$APP_A_TOKEN" \
            --data-urlencode 'game=PUBG' \
            --data-urlencode 'user_key=TD-MULTI-APP-ALPHA-KEY' \
            --data-urlencode 'serial=MULTI-APP-SERIAL-A' \
            | jq -e '.status == true' >/dev/null

          curl -sS -X POST "http://127.0.0.1:8080/connect/$APP_B_TOKEN" \
            --data-urlencode 'game=PUBG' \
            --data-urlencode 'user_key=TD-MULTI-APP-ALPHA-KEY' \
            --data-urlencode 'serial=MULTI-APP-SERIAL-A' \
            | jq -e '.status == false and .reason == "Invalid Key"' >/dev/null

          curl -sS -X POST 'http://127.0.0.1:8080/connect' \
            --data-urlencode 'game=PUBG' \
            --data-urlencode 'user_key=TD-TEST-TIMED-KEY-0001' \
            --data-urlencode 'serial=MULTI-OFFICIAL-SERIAL' \
            | jq -e '.status == true' >/dev/null

          curl -sS -X POST 'http://127.0.0.1:8080/connect' \
            --data-urlencode 'game=PUBG' \
            --data-urlencode 'user_key=TD-MULTI-APP-ALPHA-KEY' \
            --data-urlencode 'serial=MULTI-APP-SERIAL-A' \
            | jq -e '.status == false and .reason == "Invalid Key"' >/dev/null

      - name: Verify routing and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'connect(?:/[A-Za-z0-9_-]{8,64})?' teamdark-panel/.htaccess >/dev/null
          grep -F 'connect(?:/[A-Za-z0-9_-]{8,64})?' teamdark-panel/public/.htaccess >/dev/null
          grep -F 'owner/apps(?:/.*)?' teamdark-panel/.htaccess >/dev/null
          grep -F "'/owner/apps', 'App APIs'" teamdark-panel/app/View.php >/dev/null
          grep -F 'name="app_ids[]"' teamdark-panel/public/index.php >/dev/null
          grep -F 'name="app_id"' teamdark-panel/public/index.php >/dev/null
          grep -F 'public static function lockForRegistration' teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F '@td_user_app_access_existed' teamdark-panel/database/schema.sql >/dev/null
          grep -F '@td_referral_app_access_existed' teamdark-panel/database/schema.sql >/dev/null

      - name: Show HTTP log on failure
        if: failure()
        shell: bash
        run: cat /tmp/teamdark-multi-http.log 2>/dev/null || true
