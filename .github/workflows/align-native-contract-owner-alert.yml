name: Align Native Contract Owner Alert

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/align-native-contract-owner-alert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
      - name: Align owner integration test with dedicated alert page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('teamdark-panel/tests/owner_controls_integration.php')
          s = p.read_text()
          s2 = s.replace("request($ownerClient,'/owner/settings#announcements')", "request($ownerClient,'/owner/alerts')", 1)
          s2 = s2.replace("str_contains($settingsPage['body'],'BROADCAST CENTER')", "str_contains($settingsPage['body'],'DELIVERY ENGINE')", 1)
          if s2 == s:
              raise SystemExit('expected old owner alert test markers not found')
          p.write_text(s2)
          PY
          php -l teamdark-panel/tests/owner_controls_integration.php
          grep -F "request(\$ownerClient,'/owner/alerts')" teamdark-panel/tests/owner_controls_integration.php >/dev/null
          grep -F "'DELIVERY ENGINE'" teamdark-panel/tests/owner_controls_integration.php >/dev/null
      - name: Commit test alignment
        run: |
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel/tests/owner_controls_integration.php
          git commit -m 'Align owner integration test with Panel Alert module'
          git push origin HEAD:TeamDarkLoader
