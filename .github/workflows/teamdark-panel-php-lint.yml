name: TeamDark Panel Audit

on:
  pull_request:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-panel-php-lint.yml'
  push:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-panel-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, json, fileinfo, curl
          coverage: none

      - name: Lint every TeamDark PHP file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find teamdark-panel -type f -name '*.php' -print0 | sort -z)
          test "${#php_files[@]}" -gt 0
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Syntax-check every TeamDark JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' js_files < <(find teamdark-panel/public/assets -type f -name '*.js' -print0 | sort -z)
          test "${#js_files[@]}" -gt 0
          for file in "${js_files[@]}"; do
            node --check "$file"
          done

      - name: Verify private File Manager route ordering and controllers
        shell: bash
        run: |
          set -euo pipefail
          test -f teamdark-panel/public/vault-entry.php
          test -f teamdark-panel/public/vault.php
          test -f teamdark-panel/public/file-download.php
          test -f teamdark-panel/app/UploadManager.php
          test -f teamdark-panel/app/CdnCache.php
          test -f teamdark-panel/storage/private_uploads/.htaccess

          grep -F 'files/download/?$ public/file-download.php' teamdark-panel/.htaccess >/dev/null
          grep -F 'files(?:/.*)?$ public/vault-entry.php' teamdark-panel/.htaccess >/dev/null
          grep -F 'files/download/?$ file-download.php' teamdark-panel/public/.htaccess >/dev/null
          grep -F 'files(?:/.*)?$ vault-entry.php' teamdark-panel/public/.htaccess >/dev/null

          root_download=$(grep -n -F 'files/download/?$ public/file-download.php' teamdark-panel/.htaccess | head -1 | cut -d: -f1)
          root_catchall=$(grep -n -F 'files(?:/.*)?$ public/vault-entry.php' teamdark-panel/.htaccess | head -1 | cut -d: -f1)
          public_download=$(grep -n -F 'files/download/?$ file-download.php' teamdark-panel/public/.htaccess | head -1 | cut -d: -f1)
          public_catchall=$(grep -n -F 'files(?:/.*)?$ vault-entry.php' teamdark-panel/public/.htaccess | head -1 | cut -d: -f1)
          test "$root_download" -lt "$root_catchall"
          test "$public_download" -lt "$public_catchall"

      - name: Verify 50 MB upload and optional CDN purge wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MAX_FILE_BYTES = 52428800' teamdark-panel/app/UploadManager.php >/dev/null
          grep -F 'upload_max_filesize = 50M' teamdark-panel/.user.ini >/dev/null
          grep -F 'post_max_size = 55M' teamdark-panel/.user.ini >/dev/null
          grep -F 'upload_max_filesize = 50M' teamdark-panel/public/.user.ini >/dev/null
          grep -F 'CLOUDFLARE_CACHE_ENABLED' teamdark-panel/.env.example >/dev/null
          grep -F 'cloudflare_cache_enabled' teamdark-panel/app/Config.php >/dev/null
          grep -F 'CdnCache::purgeVaultFile' teamdark-panel/app/UploadManager.php >/dev/null
          grep -F '/purge_cache' teamdark-panel/app/CdnCache.php >/dev/null

      - name: Verify modular Owner System and screenshot-inspired navigation
        shell: bash
        run: |
          set -euo pipefail
          test -f teamdark-panel/app/OwnerSystem.php
          test -f teamdark-panel/public/assets/system-console.css
          grep -F "'File Manager'" teamdark-panel/app/View.php >/dev/null
          grep -F "'/keys/extend'" teamdark-panel/public/index.php >/dev/null
          grep -F "'Extend Duration'" teamdark-panel/app/View.php >/dev/null
          grep -F "'/owner/server'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/device-policy'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/key-format'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/pricing'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/ip-management'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/rebranding'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/security'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/session-controls'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/packages'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/alerts'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F "'/owner/update'" teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F 'generated_key_prefix' teamdark-panel/app/KeyManager.php >/dev/null
          grep -F 'key_cost_per_day' teamdark-panel/app/KeyManager.php >/dev/null
          grep -F 'force_one_device_new_keys' teamdark-panel/app/KeyManager.php >/dev/null
          grep -F 'ownerIpPolicyBlocked' teamdark-panel/app/Security.php >/dev/null
          grep -F 'data-key-edit-link="1"' teamdark-panel/public/index.php >/dev/null

      - name: Verify user App API access and referral starting balance
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'grant_balance BIGINT UNSIGNED NOT NULL DEFAULT 0' teamdark-panel/database/schema.sql >/dev/null
          grep -F "MAX_REFERRAL_BALANCE = 1000000000" teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F 'grantInviteBalanceToUser' teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F "Referral balance grant" teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F "AND (expires_at IS NULL OR expires_at>NOW())" teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F "AND (expires_at IS NULL OR expires_at>NOW())" teamdark-panel/public/index.php >/dev/null
          grep -F "'/my-apps'" teamdark-panel/app/View.php >/dev/null
          grep -F "My App APIs" teamdark-panel/public/index.php >/dev/null
          grep -F "name=\"grant_balance\"" teamdark-panel/public/index.php >/dev/null
          grep -F 'grantInviteBalanceToUser' teamdark-panel/public/register-relaxed.php >/dev/null

      - name: Verify relaxed password and key editor wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RewriteRule ^register/?$ public/register-relaxed.php' teamdark-panel/.htaccess >/dev/null
          grep -F 'password-actions.php' teamdark-panel/.htaccess >/dev/null
          grep -F 'RewriteRule ^key-edit/?$ public/key-edit.php' teamdark-panel/.htaccess >/dev/null
          grep -F "strlen(\$password) >= 1" teamdark-panel/public/password-actions.php >/dev/null
          grep -F 'KeyManager::price' teamdark-panel/app/KeyEditor.php >/dev/null
          grep -F "'KeyManager'" teamdark-panel/public/key-edit.php >/dev/null

      - name: Guard the native Connect API contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "\$game = isset(\$_POST['game'])" teamdark-panel/public/connect.php >/dev/null
          grep -F "\$userKey = isset(\$_POST['user_key'])" teamdark-panel/public/connect.php >/dev/null
          grep -F "\$serial = isset(\$_POST['serial'])" teamdark-panel/public/connect.php >/dev/null
          grep -F 'LoaderAuthService::authenticate' teamdark-panel/public/connect.php >/dev/null
          grep -F "if (\$method === 'GET' || \$method === 'HEAD')" teamdark-panel/public/connect.php >/dev/null

      - name: Verify private storage is not web-addressable
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RewriteRule ^(?:app|database|bin|storage|vendor|tests|docs-src)' teamdark-panel/.htaccess >/dev/null
          grep -E 'Require all denied|Deny from all' teamdark-panel/storage/private_uploads/.htaccess >/dev/null
