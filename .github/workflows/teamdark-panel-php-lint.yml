name: TeamDark Panel PHP Lint

on:
  pull_request:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-panel-php-lint.yml'
  push:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/**'
      - '.github/workflows/teamdark-panel-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, openssl, json
          coverage: none

      - name: Lint all TeamDark panel PHP files
        shell: bash
        run: |
          set -euo pipefail
          find teamdark-panel -type f -name '*.php' -print0             | sort -z             | xargs -0 -n1 php -l

      - name: Validate premium panel JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check teamdark-panel/public/assets/app.js
          grep -F 'TeamDark Premium UI v5' teamdark-panel/public/assets/app.css >/dev/null
          grep -F 'data-teamdark-ui="5"' teamdark-panel/app/View.php >/dev/null
          grep -F '/assets/app.css?v=20260909-6' teamdark-panel/app/View.php >/dev/null
          grep -F '/assets/app.js?v=20260909-6' teamdark-panel/app/View.php >/dev/null
