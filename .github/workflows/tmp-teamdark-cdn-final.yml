name: TeamDark CDN Finalizer

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/tmp-teamdark-cdn-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
          fetch-depth: 0

      - name: Apply CDN and UI patch
        run: python3 .github/tmp-teamdark-cdn-patch.py

      - name: Verify PHP and CDN wiring
        shell: bash
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/CdnCache.php
          php -l teamdark-panel/app/Config.php
          php -l teamdark-panel/app/UploadManager.php
          php -l teamdark-panel/public/cdn-download.php
          php -l teamdark-panel/public/vault.php
          php -l teamdark-panel/app/View.php
          grep -F 'cdn-files/[0-9]+/[0-9]+/[a-f0-9]{64}/asset\.zip' teamdark-panel/.htaccess >/dev/null
          grep -F 'cdn-files/[0-9]+/[0-9]+/[a-f0-9]{64}/asset\.zip' teamdark-panel/public/.htaccess >/dev/null
          grep -F 'Cache-Control: public' teamdark-panel/public/cdn-download.php >/dev/null
          grep -F 'CdnCache::purgeVaultRow' teamdark-panel/app/UploadManager.php >/dev/null
          grep -F 'CDN_FILE_CACHE_SECONDS' teamdark-panel/.env.example >/dev/null
          grep -F '[data-dialog-copy]:not([hidden])' teamdark-panel/public/assets/app.css >/dev/null
          ! grep -F 'button[hidden]+button{grid-column:1/-1}' teamdark-panel/public/assets/app.css

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel
          git commit -m 'Add versioned CDN file delivery and fix dialog actions'
          git push origin HEAD:TeamDarkLoader
