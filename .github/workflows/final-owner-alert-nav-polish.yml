name: Final Owner Alert Nav Polish

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/final-owner-alert-nav-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
      - name: Apply polish patch
        run: |
          python3 -m py_compile scripts/final_owner_alert_nav_polish.py
          python3 scripts/final_owner_alert_nav_polish.py
      - name: Validate
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/View.php
          php -l teamdark-panel/app/OwnerSystem.php
          node --check teamdark-panel/public/assets/app.js
          grep -F '$qualified = str_contains($href' teamdark-panel/app/View.php >/dev/null
          grep -F 'data-broadcast-queue' teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F 'data-broadcast-job' teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F 'id="broadcast-message"' teamdark-panel/app/OwnerSystem.php >/dev/null
          grep -F 'data-audience-option' teamdark-panel/app/OwnerSystem.php >/dev/null
      - name: Commit app polish
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel/app/View.php teamdark-panel/app/OwnerSystem.php
          git commit -m 'Finish Panel Alert queue and sidebar state'
          git push origin HEAD:TeamDarkLoader
