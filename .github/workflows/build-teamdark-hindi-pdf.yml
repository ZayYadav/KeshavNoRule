name: Build TeamDark Hindi PDF

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - 'teamdark-panel/docs-src/**'
      - '.github/workflows/build-teamdark-hindi-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teamdark-hindi-pdf-TeamDarkLoader
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout TeamDarkLoader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hindi PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            pandoc \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            shared-mime-info \
            poppler-utils
          python3 -m pip install --upgrade pip
          python3 -m pip install 'weasyprint>=62,<70'
          fc-match 'Noto Sans Devanagari'

      - name: Assemble Hindi guide source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            teamdark-panel/docs-src/TeamDark_Full_Configuration_Hindi.part1.md \
            teamdark-panel/docs-src/TeamDark_Full_Configuration_Hindi.part2.md \
            teamdark-panel/docs-src/TeamDark_Full_Configuration_Hindi.part3.md \
            > /tmp/TeamDark_Full_Configuration_Hindi.md

          test -s /tmp/TeamDark_Full_Configuration_Hindi.md
          grep -F 'पूर्ण कॉन्फ़िगरेशन और डिप्लॉयमेंट गाइड' /tmp/TeamDark_Full_Configuration_Hindi.md >/dev/null
          grep -F 'Unregistered TG user - 2H / 7-day rule' /tmp/TeamDark_Full_Configuration_Hindi.md >/dev/null

      - name: Render PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p teamdark-panel/docs

          pandoc \
            /tmp/TeamDark_Full_Configuration_Hindi.md \
            --from=gfm \
            --to=html5 \
            --standalone \
            --metadata title='TEAM DARK Full Configuration Hindi' \
            -o /tmp/teamdark-hindi-guide.html

          weasyprint \
            -s teamdark-panel/docs-src/print.css \
            /tmp/teamdark-hindi-guide.html \
            teamdark-panel/docs/TEAM_DARK_Full_Configuration_Hindi.pdf

      - name: Validate generated PDF
        shell: bash
        run: |
          set -euo pipefail
          PDF='teamdark-panel/docs/TEAM_DARK_Full_Configuration_Hindi.pdf'
          test -s "$PDF"

          SIZE="$(stat -c%s "$PDF")"
          test "$SIZE" -gt 50000

          head -c 5 "$PDF" | grep -F '%PDF-' >/dev/null
          pdfinfo "$PDF" | tee /tmp/pdfinfo.txt
          grep -F 'Pages:' /tmp/pdfinfo.txt >/dev/null

          echo "Generated PDF size: $SIZE bytes"

      - name: Commit generated PDF
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'TeamDark PDF Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add teamdark-panel/docs/TEAM_DARK_Full_Configuration_Hindi.pdf

          if git diff --cached --quiet; then
            echo 'PDF is already up to date.'
            exit 0
          fi

          git commit -m 'Add TeamDark full configuration Hindi PDF'
          git push origin HEAD:TeamDarkLoader
