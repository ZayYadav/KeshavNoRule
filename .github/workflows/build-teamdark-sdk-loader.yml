name: Build TeamDark SDK + Loader

run-name: TeamDark release from SDK ${{ inputs.sdk_ref || 'TeamDarkSDK' }}

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "ParallaxSDK TeamDark SDK ref/branch"
        required: false
        default: "TeamDarkSDK"
  push:
    branches:
      - TeamDarkLoader
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-teamdark-sdk-loader.yml'

permissions:
  contents: read

concurrency:
  group: teamdark-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TeamDarkCore AAR and TeamDarkLoader APK
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    env:
      SDK_REPO: ZayYadav/ParallaxSDK
      SDK_REF: ${{ inputs.sdk_ref || 'TeamDarkSDK' }}
      SDK_CHECKOUT_DIR: _teamdark_sdk
      SDK_PROJECT_DIR: _teamdark_sdk/TeamDarkSDK/BLACK-OPNE
      SDK_MODULE: TeamDarkCore
      SDK_MODULE_DIR: RIYAZ-VIP
      APP_AAR_PATH: app/libs/TeamDarkCore-release.aar
      SDK_NDK_VERSION: 27.2.12479018
      APP_NDK_VERSION: 24.0.8215888
      APP_CMAKE_VERSION: 3.22.1
      TEAM_DARK_KEY_ALIAS: TeamDarkParallax
      TEAM_DARK_EXPECTED_CERT_SHA256: 95D42274430C198E20056DA00E5E4DCAFD5935D93D2E4380E2788B1B7FF8A32F

    steps:
      - name: Checkout TeamDarkLoader
        uses: actions/checkout@v4

      - name: Checkout TeamDark SDK source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: ${{ env.SDK_CHECKOUT_DIR }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "ndk;${SDK_NDK_VERSION}" \
            "ndk;${APP_NDK_VERSION}" \
            "cmake;${APP_CMAKE_VERSION}"

      - name: Configure Gradle projects
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          chmod +x ./gradlew
          chmod +x "${SDK_PROJECT_DIR}/gradlew"

      - name: Record source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-integration-info
          SDK_SHA="$(git -C "${SDK_CHECKOUT_DIR}" rev-parse HEAD)"
          LOADER_SHA="$(git rev-parse HEAD)"
          {
            echo "sdk_repository=${SDK_REPO}"
            echo "sdk_ref=${SDK_REF}"
            echo "sdk_sha=${SDK_SHA}"
            echo "loader_sha=${LOADER_SHA}"
          } | tee build-integration-info/source-revisions.txt

      - name: Verify preserved panel/runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F 'SDK-8FB9E9C2AF9126A7C74250E5' app/src/main >/dev/null
          grep -R -F 'libbgmi.so' app/src/main/java >/dev/null
          grep -R -F 'jaduloader.parallaxserver.online' app/src/main/jni >/dev/null
          grep -F "namespace 'com.team.dark'" app/build.gradle >/dev/null
          grep -F 'applicationId "com.team.dark"' app/build.gradle >/dev/null
          if grep -R -E 'package com\.bgmi|import com\.bgmi|Java_com_bgmi_|applicationId "com\.bgmi"|namespace .com\.bgmi.|KESHAVFRIEND' app/src/main app/build.gradle; then
            echo 'Old package/SDK identity remains in active TeamDark source.' >&2
            exit 1
          fi

      - name: Build TeamDark SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :${SDK_MODULE}:assembleRelease --no-daemon --stacktrace

      - name: Install fresh TeamDark SDK AAR
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -s "$SOURCE_AAR"
          unzip -tq "$SOURCE_AAR"
          unzip -Z1 "$SOURCE_AAR" | grep -q 'jni/arm64-v8a/libTeamDarkCore.so'
          if unzip -Z1 "$SOURCE_AAR" | grep -q 'libKESHAVXOWNERCore\.so'; then
            echo 'Old SDK native library name remains in AAR.' >&2
            exit 1
          fi
          rm -f app/libs/*.aar
          mkdir -p app/libs
          cp -f "$SOURCE_AAR" "${APP_AAR_PATH}"
          sha256sum "${APP_AAR_PATH}" | tee build-integration-info/TeamDarkCore-release.aar.sha256

      - name: Compile TeamDarkLoader debug validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$DEBUG_APK"
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging "$DEBUG_APK"             | grep -q "package: name='com.team.dark'"
          cp "$DEBUG_APK" app/build/outputs/apk/debug/TeamDarkLoader-debug-validation.apk

      - name: Upload TeamDark debug validation APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamDarkLoader-debug-validation
          path: app/build/outputs/apk/debug/TeamDarkLoader-debug-validation.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate TeamDark release signing config
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE='app/TeamDarkParallax.jks'
          test -s "$KEYSTORE" || { echo 'Missing app/TeamDarkParallax.jks' >&2; exit 1; }
          grep -F "storeFile teamDarkKeystore" app/build.gradle >/dev/null
          grep -F "keyAlias teamDarkKeyAlias" app/build.gradle >/dev/null
          grep -F "def teamDarkKeyAlias = 'TeamDarkParallax'" app/build.gradle >/dev/null

      - name: Build TeamDarkLoader release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify TeamDarkLoader release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          test -s "$APK"

          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

          APK_CERT="$("${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | tr -d ':[:space:]'             | tr '[:lower:]' '[:upper:]')"
          test "$APK_CERT" = "$TEAM_DARK_EXPECTED_CERT_SHA256" || {
            echo "Release APK signer mismatch: $APK_CERT" >&2
            exit 1
          }

          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.team.dark'"

          mapfile -t LIBS < <(
            unzip -Z1 "$APK" \
              | grep '^lib/arm64-v8a/.*\.so$' \
              | sed 's#^lib/arm64-v8a/##' \
              | sort
          )

          printf 'Packaged arm64 libraries:\n'
          printf '  %s\n' "${LIBS[@]}"
          printf '%s\n' "${LIBS[@]}" | grep -qx 'libTeamDarkCore.so'
          printf '%s\n' "${LIBS[@]}" | grep -qx 'libTeamDarkLoader.so'

          if printf '%s\n' "${LIBS[@]}" | grep -Eq 'libKESHAVXOWNERCore\.so|libKeshavLoader\.so'; then
            echo 'Old branded native library remains packaged.' >&2
            exit 1
          fi

          cp "$APK" app/build/outputs/apk/release/TeamDarkLoader-release.apk
          sha256sum app/build/outputs/apk/release/TeamDarkLoader-release.apk \
            | tee build-integration-info/TeamDarkLoader-release.apk.sha256

      - name: Upload fresh TeamDark SDK AAR
        uses: actions/upload-artifact@v4
        with:
          name: TeamDarkCore-release-aar
          path: ${{ env.APP_AAR_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload TeamDarkLoader release APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamDarkLoader-release
          path: app/build/outputs/apk/release/TeamDarkLoader-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload TeamDark build info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeamDark-build-info
          path: build-integration-info/
          if-no-files-found: warn
          retention-days: 30
