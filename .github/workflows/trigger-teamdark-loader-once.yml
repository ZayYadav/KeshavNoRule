name: Trigger TeamDark Loader Once

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/trigger-teamdark-loader-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TeamDark SDK + Loader build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n '{ref:"TeamDarkLoader",inputs:{sdk_ref:"TeamDarkSDK"}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/build-teamdark-sdk-loader.yml/dispatches" \
            -d "$payload"
