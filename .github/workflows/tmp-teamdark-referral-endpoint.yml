name: TeamDark Endpoint Referral Finalizer

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/tmp-teamdark-referral-endpoint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader
          fetch-depth: 0

      - name: Apply expiry-aware quota fix
        run: python3 .github/tmp-teamdark-referral-expiry-fix.py

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/ReferralManager.php
          php -l teamdark-panel/public/index.php

      - name: Verify quota filters
        shell: bash
        run: |
          set -euo pipefail
          grep -F "AND (expires_at IS NULL OR expires_at>NOW())" teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F "AND (expires_at IS NULL OR expires_at>NOW())" teamdark-panel/public/index.php >/dev/null

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TeamDark CI"
          git config user.email "actions@users.noreply.github.com"
          git add teamdark-panel/
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "Make referral balance reservations expiry aware"
          git push origin HEAD:TeamDarkLoader
