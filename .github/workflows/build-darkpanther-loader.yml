name: Build Dark Panther Loader

run-name: Dark Panther release from SDK ${{ inputs.sdk_ref || 'TeamDarkSDK' }}

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "ParallaxSDK compatible SDK ref/branch"
        required: false
        default: "TeamDarkSDK"
  push:
    branches:
      - DarkPanther
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-darkpanther-loader.yml'

permissions:
  contents: read

concurrency:
  group: dark-panther-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fresh SDK + Dark Panther APK
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    env:
      SDK_REPO: ZayYadav/ParallaxSDK
      SDK_REF: ${{ inputs.sdk_ref || 'TeamDarkSDK' }}
      SDK_CHECKOUT_DIR: _darkpanther_sdk
      SDK_PROJECT_DIR: _darkpanther_sdk/TeamDarkSDK/BLACK-OPNE
      SDK_MODULE: TeamDarkCore
      SDK_MODULE_DIR: RIYAZ-VIP
      APP_AAR_PATH: app/libs/TeamDarkCore-release.aar
      SDK_NDK_VERSION: 27.2.12479018
      APP_NDK_VERSION: 24.0.8215888
      APP_CMAKE_VERSION: 3.22.1
      EXPECTED_CERT_SHA256: 95D42274430C198E20056DA00E5E4DCAFD5935D93D2E4380E2788B1B7FF8A32F

    steps:
      - name: Checkout DarkPanther
        uses: actions/checkout@v4

      - name: Checkout compatible SDK source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: ${{ env.SDK_CHECKOUT_DIR }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "ndk;${SDK_NDK_VERSION}" \
            "ndk;${APP_NDK_VERSION}" \
            "cmake;${APP_CMAKE_VERSION}"

      - name: Configure Gradle projects
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          chmod +x ./gradlew
          chmod +x "${SDK_PROJECT_DIR}/gradlew"

      - name: Verify preserved contracts and complete Java rebrand
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://teamdarkloader.parallaxserver.online/connect' app/src/main/jni/main.cpp >/dev/null
          grep -F 'releases/download/Jadu/version.txt' app/src/main/jni/main.cpp >/dev/null
          grep -F 'releases/download/Jadu/V4.zip' app/src/main/jni/main.cpp >/dev/null
          grep -F 'TRUSTED_LOADER_NAME = "libbgmi.so"' app/src/main/java/com/dark/panther/core/PantherLoaderUpdater.java >/dev/null
          grep -F 'ZIP_NAME = "imgui.zip"' app/src/main/java/com/dark/panther/core/PantherLoaderUpdater.java >/dev/null
          grep -F 'applicationId "com.team.dark"' app/build.gradle >/dev/null
          grep -F "namespace 'com.dark.panther'" app/build.gradle >/dev/null
          grep -F 'add_library(DarkPantherLoader SHARED' app/src/main/jni/CMakeLists.txt >/dev/null
          grep -F 'libDarkPantherLoader.so' app/src/main/jni/custom_integrity.cpp >/dev/null
          grep -F '<string name="app_name">Dark Panther Loader</string>' app/src/main/res/values/strings.xml >/dev/null
          grep -F 'com.dark.panther.DarkPantherLoginActivity' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'com.dark.panther.DarkPantherHomeActivity' app/src/main/AndroidManifest.xml >/dev/null

          if find app/src/main/java -type f -name '*.java' -print0 \
            | xargs -0 grep -nE 'package com\.team\.dark|import com\.team\.dark|class TeamDark[0-9]'; then
            echo 'Legacy TeamDark Java classes/imports remain in active loader source.' >&2
            exit 1
          fi

      - name: Build fresh compatible SDK AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :${SDK_MODULE}:assembleRelease --no-daemon --stacktrace

      - name: Install fresh SDK AAR into loader
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -s "$SOURCE_AAR"
          unzip -tq "$SOURCE_AAR"
          unzip -Z1 "$SOURCE_AAR" | grep -q 'jni/arm64-v8a/libTeamDarkCore.so'
          rm -rf app/libs
          mkdir -p app/libs
          cp -f "$SOURCE_AAR" "${APP_AAR_PATH}"
          sha256sum "${APP_AAR_PATH}"

      - name: Build debug validation APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.team.dark'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'Dark Panther Loader'"
          mapfile -t LIBS < <(unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*\.so$' | sed 's#^lib/arm64-v8a/##' | sort)
          printf 'Packaged arm64 libraries:\n'
          printf '  %s\n' "${LIBS[@]}"
          printf '%s\n' "${LIBS[@]}" | grep -qx 'libDarkPantherLoader.so'
          printf '%s\n' "${LIBS[@]}" | grep -qx 'libTeamDarkCore.so'
          if printf '%s\n' "${LIBS[@]}" | grep -qx 'libTeamDarkLoader.so'; then
            echo 'Old compiled TeamDark loader library is still packaged.' >&2
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/debug/DarkPantherLoader-debug.apk

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/TeamDarkParallax.jks
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256" || {
            echo "Release signer mismatch: $CERT" >&2
            exit 1
          }
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.team.dark'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'Dark Panther Loader'"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libDarkPantherLoader\.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libTeamDarkCore\.so$'
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libTeamDarkLoader\.so$'; then
            echo 'Old compiled TeamDark loader library remains in release APK.' >&2
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/release/DarkPantherLoader-release.apk
          sha256sum app/build/outputs/apk/release/DarkPantherLoader-release.apk

      - name: Upload fresh SDK AAR
        uses: actions/upload-artifact@v4
        with:
          name: DarkPanther-compatible-SDK-AAR
          path: ${{ env.APP_AAR_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkPantherLoader-debug
          path: app/build/outputs/apk/debug/DarkPantherLoader-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkPantherLoader-release
          path: app/build/outputs/apk/release/DarkPantherLoader-release.apk
          if-no-files-found: error
          retention-days: 30
