name: Delete merged final panel security branch

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - .github/workflows/delete-final-panel-security-branch.yml

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete TeamDarkLoader-final-panel-security
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH_TO_DELETE: TeamDarkLoader-final-panel-security
        shell: bash
        run: |
          set -euo pipefail

          status="$(curl -sS -o /tmp/delete-ref-response.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/git/refs/heads/$BRANCH_TO_DELETE")"

          if [[ "$status" != "204" && "$status" != "422" ]]; then
            cat /tmp/delete-ref-response.json >&2 || true
            echo "Unexpected delete status: $status" >&2
            exit 1
          fi

          echo "Branch delete request completed with HTTP $status"
