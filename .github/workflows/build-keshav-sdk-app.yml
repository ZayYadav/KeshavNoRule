name: Build KESHAVXOWNER SDK + KeshavNoRule
run-name: Build KESHAVXOWNER fresh SDK (${{ inputs.sdk_ref || 'KESHAVXOWNER' }})

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "ParallaxSDK ref/branch containing KESHAVXOWNER SDK"
        required: false
        default: "KESHAVXOWNER"
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-keshav-sdk-app.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build latest KESHAVXOWNER AAR and KeshavNoRule APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      SDK_REPO: ZayYadav/ParallaxSDK
      SDK_REF: ${{ inputs.sdk_ref || 'KESHAVXOWNER' }}
      SDK_CHECKOUT_DIR: _keshav_sdk
      SDK_PROJECT_DIR: _keshav_sdk/KESHAVXOWNERSDK/BLACK-OPNE
      SDK_MODULE: KESHAVXOWNERCore
      SDK_MODULE_DIR: RIYAZ-VIP
      APP_AAR_PATH: app/libs/KESHAVXOWNERCore-release.aar
      SDK_NDK_VERSION: 27.2.12479018
      APP_NDK_VERSION: 24.0.8215888
      APP_CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout KeshavNoRule
        uses: actions/checkout@v4

      - name: Checkout KESHAVXOWNER SDK source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: ${{ env.SDK_CHECKOUT_DIR }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "ndk;${SDK_NDK_VERSION}" \
            "ndk;${APP_NDK_VERSION}" \
            "cmake;${APP_CMAKE_VERSION}"

      - name: Configure Gradle projects
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          chmod +x ./gradlew
          chmod +x "${SDK_PROJECT_DIR}/gradlew"

      - name: Record SDK source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-integration-info
          SDK_SHA="$(git -C "${SDK_CHECKOUT_DIR}" rev-parse HEAD)"
          {
            echo "sdk_repository=${SDK_REPO}"
            echo "sdk_ref=${SDK_REF}"
            echo "sdk_sha=${SDK_SHA}"
            echo "sdk_commit_url=https://github.com/${SDK_REPO}/commit/${SDK_SHA}"
          } | tee build-integration-info/sdk-source.txt

      - name: Verify SDK panel trust anchors
        shell: bash
        run: |
          set -euo pipefail
          TRUST_JSON="${SDK_CHECKOUT_DIR}/panels/sdk-panel/sdk-v3-public-trust.json"
          SDK_GRADLE="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build.gradle"
          test -s "$TRUST_JSON"
          test -s "$SDK_GRADLE"

          python3 - "$TRUST_JSON" "$SDK_GRADLE" <<'PY'
          import json
          import pathlib
          import sys

          trust = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          gradle = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = {
              "SDK_PANEL_KEY_ID": trust["key_id"],
              "SDK_PANEL_ECDH_PUBLIC_KEY": trust["ecdh_public_key_b64"],
              "SDK_PANEL_SIGNING_PUBLIC_KEY": trust["signing_public_key_b64"],
          }
          missing = [
              name for name, value in expected.items()
              if f"'{name}', '\"{value}\"'" not in gradle
          ]
          if missing:
              raise SystemExit("SDK panel trust anchor mismatch: " + ", ".join(missing))
          print("SDK panel trust anchors match", trust["key_id"])
          PY

      - name: Build KESHAVXOWNER SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :${SDK_MODULE}:assembleRelease --no-daemon --stacktrace

      - name: Install fresh SDK AAR into KeshavNoRule
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -s "$SOURCE_AAR"
          unzip -tq "$SOURCE_AAR"
          mkdir -p "$(dirname "${APP_AAR_PATH}")"
          cp -f "$SOURCE_AAR" "${APP_AAR_PATH}"
          sha256sum "${APP_AAR_PATH}" | tee build-integration-info/KESHAVXOWNERCore-release.aar.sha256

      - name: Build KeshavNoRule release APK with fresh SDK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          test -s "$APK"

          echo "APK: $APK"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

          mapfile -t LIBS < <(
            unzip -Z1 "$APK" \
              | grep '^lib/arm64-v8a/.*\.so$' \
              | sed 's#^lib/arm64-v8a/##' \
              | sort
          )

          printf 'Packaged arm64 libraries:\n'
          printf '  %s\n' "${LIBS[@]}"

          printf '%s\n' "${LIBS[@]}" | grep -qx 'libKESHAVXOWNERCore.so'
          printf '%s\n' "${LIBS[@]}" | grep -qx 'libKeshavLoader.so'

          cp "$APK" app/build/outputs/apk/release/KeshavNoRule-KESHAVXOWNER-release.apk
          sha256sum app/build/outputs/apk/release/KeshavNoRule-KESHAVXOWNER-release.apk \
            | tee build-integration-info/KeshavNoRule-KESHAVXOWNER-release.apk.sha256

      - name: Upload fresh KESHAVXOWNER AAR
        uses: actions/upload-artifact@v4
        with:
          name: KESHAVXOWNERCore-release-aar
          path: ${{ env.APP_AAR_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload KeshavNoRule release APK
        uses: actions/upload-artifact@v4
        with:
          name: KeshavNoRule-KESHAVXOWNER-release
          path: app/build/outputs/apk/release/KeshavNoRule-KESHAVXOWNER-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload integration build info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeshavNoRule-KESHAVXOWNER-build-info
          path: build-integration-info/
          if-no-files-found: warn
          retention-days: 30
