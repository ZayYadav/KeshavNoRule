name: Apply TeamDark Multi App Audit Fix

on:
  push:
    branches:
      - TeamDarkLoader
    paths:
      - '.github/workflows/apply-teamdark-multi-app-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TeamDarkLoader

      - name: Apply audited multi-app hardening
        run: python3 scripts/apply_teamdark_multi_app_api.py

      - name: Validate patched application
        shell: bash
        run: |
          set -euo pipefail
          php -l teamdark-panel/app/AppRegistry.php
          php -l teamdark-panel/app/ReferralManager.php
          php -l teamdark-panel/app/LoaderAuthService.php
          php -l teamdark-panel/app/KeyManager.php
          php -l teamdark-panel/public/connect.php
          php -l teamdark-panel/public/index.php
          php -l teamdark-panel/public/register-relaxed.php
          php -l teamdark-panel/public/app-api-manager.php
          php -l teamdark-panel/tests/multi_app_contract.php
          php -l teamdark-panel/tests/owner_controls_integration.php
          grep -F 'public static function lockForRegistration' teamdark-panel/app/ReferralManager.php >/dev/null
          grep -F "JOIN app_registry a ON a.id=k.app_id AND a.status='active'" teamdark-panel/app/LoaderAuthService.php >/dev/null
          grep -F '@td_user_app_access_existed' teamdark-panel/database/schema.sql >/dev/null
          grep -F '@td_referral_app_access_existed' teamdark-panel/database/schema.sql >/dev/null
          grep -F "'created_ts'=>time()" teamdark-panel/public/register-relaxed.php >/dev/null

      - name: Commit application changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TeamDark CI'
          git config user.email 'actions@users.noreply.github.com'
          git add teamdark-panel
          if git diff --cached --quiet; then
            echo 'No application changes to commit.'
            exit 0
          fi
          git commit -m 'Harden multi-app referral and migration isolation'
          git push origin HEAD:TeamDarkLoader
